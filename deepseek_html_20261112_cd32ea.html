<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P2P Чат — один файл</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 16px; background:#111; color:#eee; }
  h1 { font-size: 20px; }
  h2 { font-size: 15px; margin: 20px 0 6px; color:#9cf; }
  textarea { width:100%; box-sizing:border-box; background:#1c1c1c; color:#ddd; border:1px solid #333; border-radius:8px; padding:8px; font-family: ui-monospace, monospace; font-size:12px; resize:vertical; }
  button { background:#2b6cff; color:#fff; border:0; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.sec { background:#333; }
  .row { display:flex; gap:8px; margin-top:6px; }
  #chat { border:1px solid #333; border-radius:8px; height:260px; overflow-y:auto; padding:10px; background:#0d0d0d; margin-top:12px; }
  .msg { margin:4px 0; padding:6px 10px; border-radius:8px; max-width:80%; word-wrap:break-word; }
  .me { background:#2b6cff; margin-left:auto; }
  .them { background:#2a2a2a; }
  #status { font-size:13px; color:#888; margin-top:8px; }
  #status.on { color:#4caf50; }
  .inp { display:flex; gap:8px; margin-top:10px; }
  .inp input { flex:1; background:#1c1c1c; color:#eee; border:1px solid #333; border-radius:8px; padding:10px; font-size:14px; }
</style>
</head>
<body>
<h1>🔒 P2P Чат — один HTML файл</h1>
<p style="color:#888;font-size:13px">Без сервера и регистрации. Соединение напрямую между браузерами.</p>

<h2>Шаг 1 — Хост: создайте код приглашения</h2>
<button id="btnOffer">Создать код</button>
<textarea id="offerOut" rows="4" readonly placeholder="Здесь появится код…"></textarea>
<div class="row"><button class="sec" id="copyOffer">Копировать</button></div>

<h2>Шаг 2 — Гость: вставьте код хоста</h2>
<textarea id="offerIn" rows="4" placeholder="Вставьте сюда код от хоста…"></textarea>
<div class="row"><button id="btnAnswer">Создать ответ</button></div>
<textarea id="answerOut" rows="4" readonly placeholder="Здесь появится ответный код…"></textarea>
<div class="row"><button class="sec" id="copyAnswer">Копировать</button></div>

<h2>Шаг 3 — Хост: вставьте ответ гостя</h2>
<textarea id="answerIn" rows="4" placeholder="Вставьте сюда ответный код от гостя…"></textarea>
<div class="row"><button id="btnConnect">Подключиться</button></div>

<div id="status">Статус: не подключено</div>

<div id="chat"></div>
<div class="inp">
  <input id="msg" placeholder="Сообщение…" disabled>
  <button id="send" disabled>Отправить</button>
</div>

<script>
const cfg = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
let pc, dc;
const $ = id => document.getElementById(id);
const status = t => { $('status').textContent = 'Статус: ' + t; };

function waitIce(pc){
  return new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    const t = setTimeout(res, 5000);
    pc.onicegatheringstatechange = () => {
      if (pc.iceGatheringState === 'complete'){ clearTimeout(t); res(); }
    };
  });
}

function setupPc(){
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') setConnected();
    if (['failed','disconnected','closed'].includes(pc.connectionState)) status('соединение потеряно');
  };
}

function setupDc(){
  dc.onopen = setConnected;
  dc.onmessage = e => addMsg(e.data, 'them');
  dc.onclose = () => status('канал закрыт');
}

function setConnected(){
  status('подключено ✅');
  $('status').classList.add('on');
  $('msg').disabled = false;
  $('send').disabled = false;
  $('msg').focus();
}

$('btnOffer').onclick = async () => {
  $('btnOffer').disabled = true;
  pc = new RTCPeerConnection(cfg); setupPc();
  dc = pc.createDataChannel('chat'); setupDc();
  await pc.setLocalDescription(await pc.createOffer());
  await waitIce(pc);
  $('offerOut').value = JSON.stringify(pc.localDescription);
  $('btnOffer').disabled = false;
  status('код создан, отправьте его гостю');
};

$('btnAnswer').onclick = async () => {
  try {
    pc = new RTCPeerConnection(cfg); setupPc();
    pc.ondatachannel = e => { dc = e.channel; setupDc(); };
    await pc.setRemoteDescription(JSON.parse($('offerIn').value));
    await pc.setLocalDescription(await pc.createAnswer());
    await waitIce(pc);
    $('answerOut').value = JSON.stringify(pc.localDescription);
    status('ответ создан, отправьте его хосту');
  } catch(e){ alert('Неверный код: ' + e.message); }
};

$('btnConnect').onclick = async () => {
  try {
    await pc.setRemoteDescription(JSON.parse($('answerIn').value));
    status('устанавливаем соединение…');
  } catch(e){ alert('Неверный код: ' + e.message); }
};

$('copyOffer').onclick = () => { $('offerOut').select(); document.execCommand('copy'); };
$('copyAnswer').onclick = () => { $('answerOut').select(); document.execCommand('copy'); };

function addMsg(text, who){
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  $('chat').appendChild(d);
  $('chat').scrollTop = $('chat').scrollHeight;
}

function sendMsg(){
  const t = $('msg').value.trim();
  if (!t || !dc || dc.readyState !== 'open') return;
  dc.send(t);
  addMsg(t, 'me');
  $('msg').value = '';
}

$('send').onclick = sendMsg;
$('msg').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
</script>
</body>
</html>
